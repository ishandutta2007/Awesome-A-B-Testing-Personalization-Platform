<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.3); }
      }
      .glow-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 300px 180px;
      }
      .glow-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite 2s;
        transform-origin: 1000px 240px;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatFast 5s ease-in-out infinite 1s;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
      .bar-animated-1 {
        transform-origin: bottom;
        animation: barGrow 4s ease-in-out infinite;
      }
      .bar-animated-2 {
        transform-origin: bottom;
        animation: barGrow 4s ease-in-out infinite 1.5s;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1280" height="440" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="44" x2="1280" y2="44"/>
    <line x1="0" y1="88" x2="1280" y2="88"/>
    <line x1="0" y1="132" x2="1280" y2="132"/>
    <line x1="0" y1="176" x2="1280" y2="176"/>
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="264" x2="1280" y2="264"/>
    <line x1="0" y1="308" x2="1280" y2="308"/>
    <line x1="0" y1="352" x2="1280" y2="352"/>
    <line x1="0" y1="396" x2="1280" y2="396"/>
    <line x1="80" y1="0" x2="80" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="240" y1="0" x2="240" y2="440"/>
    <line x1="320" y1="0" x2="320" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="560" y1="0" x2="560" y2="440"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
    <line x1="720" y1="0" x2="720" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
    <line x1="880" y1="0" x2="880" y2="440"/>
    <line x1="960" y1="0" x2="960" y2="440"/>
    <line x1="1040" y1="0" x2="1040" y2="440"/>
    <line x1="1120" y1="0" x2="1120" y2="440"/>
    <line x1="1200" y1="0" x2="1200" y2="440"/>
  </g>

  <!-- Ambient Glowing Orbs (Dynamic in Background) -->
  <g>
    <circle cx="280" cy="160" r="160" fill="#6366f1" filter="url(#glowPurple)" class="glow-orb-1"/>
    <circle cx="1060" cy="220" r="180" fill="#06b6d4" filter="url(#glowCyan)" class="glow-orb-2"/>
  </g>

  <!-- Dynamic Experimentation Visual Elements (Right Side Dashboard Decor) -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <!-- Variant A Card -->
    <rect x="910" y="80" width="160" height="110" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="926" y="96" width="36" height="18" rx="4" fill="#3b82f6" fill-opacity="0.25"/>
    <text x="944" y="109" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">VAR A</text>
    <text x="926" y="138" fill="#94a3b8" font-size="12" font-family="sans-serif">Conversion Rate</text>
    <text x="926" y="166" fill="#f8fafc" font-size="22" font-weight="700" font-family="sans-serif">14.2%</text>
    <path d="M1020 162 L1035 145 L1050 150" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="floating-card-2" filter="url(#cardShadow)">
    <!-- Variant B Card (Winner) -->
    <rect x="1060" y="160" width="170" height="130" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="1076" y="176" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.25"/>
    <text x="1104" y="190" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">WINNER</text>
    <text x="1076" y="218" fill="#94a3b8" font-size="12" font-family="sans-serif">Variant B Lift</text>
    <text x="1076" y="248" fill="#34d399" font-size="26" font-weight="800" font-family="sans-serif">+38.4%</text>
    <!-- Uplift Sparkline -->
    <path d="M1170 250 L1185 240 L1200 230 L1215 215" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" class="flow-line"/>
  </g>

  <!-- Dynamic Traffic Split & Flow Line -->
  <path d="M850 140 Q 880 140 910 135" fill="none" stroke="#6366f1" stroke-width="2.5" class="flow-line"/>
  <path d="M850 140 Q 950 140 1060 220" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-line"/>

  <!-- Small Feature Flag Control Indicator -->
  <g transform="translate(930, 290)" filter="url(#cardShadow)">
    <rect width="140" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="21" cy="21" r="13" fill="#10b981"/>
    <path d="M16 21 L19.5 24.5 L26 17.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="26" fill="#f1f5f9" font-size="12" font-weight="600" font-family="sans-serif">Flag: ENABLED</text>
  </g>

  <!-- FOREGROUND TEXT (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#818cf8"/>
    <text x="32" y="21" fill="#c7d2fe" class="badge-text">EXPERIMENTATION &amp; PERSONALIZATION</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" class="title-text">
      Awesome A/B Testing &amp;
    </text>
    <text x="0" y="135" fill="url(#primaryGrad)" font-size="44" class="title-text">
      Personalization Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="178" fill="#94a3b8" font-size="18" class="subtitle-text">
      Curated ecosystem of SaaS solutions &amp; open-source platforms for
    </text>
    <text x="0" y="204" fill="#cbd5e1" font-size="18" font-weight="600" class="subtitle-text">
      A/B Testing, Feature Flags, Bayesian Rollouts &amp; Dynamic Targeting.
    </text>

    <!-- Highlighted Feature Badges in Foreground -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <g>
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="70" y="22" fill="#38bdf8" text-anchor="middle" class="badge-text">⚡ A/B &amp; Multivariate</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(152, 0)">
        <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="67" y="22" fill="#a78bfa" text-anchor="middle" class="badge-text">🚩 Feature Flags</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(299, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="77" y="22" fill="#34d399" text-anchor="middle" class="badge-text">🎯 Dynamic Targeting</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(466, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="82" y="22" fill="#f472b6" text-anchor="middle" class="badge-text">🏢 Enterprise &amp; OSS</text>
      </g>
    </g>
  </g>
</svg>
